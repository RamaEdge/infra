apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpi
  namespace: devpi
spec:
  # Scaled down 2026-10-24: no uploads since 2026-03-15 and edgeworks CI is
  # dormant. PVC devpi-data is kept; set back to 1 to restore.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devpi
  template:
    metadata:
      labels:
        app: devpi
    spec:
      nodeSelector:
        node-role.apps: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devpi-server
          image: harbor.theedgeworks.ai/base/devpi:v0.6.3
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DEVPI_SERVERDIR
              value: /devpi/server
            - name: DEVPI_OUTSIDE_URL
              value: https://pypi.theedgeworks.ai
            - name: DEVPI_UPLOAD_USER
              value: upload
            - name: DEVPI_UPLOAD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devpi-upload-secret
                  key: password
          ports:
            - containerPort: 3141
              name: http
          readinessProbe:
            httpGet:
              path: /+api
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /+api
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: devpi-data
              mountPath: /devpi/server
      volumes:
        - name: devpi-data
          persistentVolumeClaim:
            claimName: devpi-data
