# Connects External Secrets Operator to the in-cluster Infisical vault.
# The machine identity (Universal Auth, Viewer on the project, trusted IPs
# limited to the pod network) is stored in external-secrets/infisical-universal-auth,
# created out-of-band: keys clientId and clientSecret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  # Only namespaces that consume the wildcard cert may reference this store
  conditions:
    - namespaces:
        - chromadb
        - devpi
        - harbor
        - keycloak
        - longhorn-system
        - monitoring
  provider:
    infisical:
      # In-cluster service; allowed by the infisical NetworkPolicy.
      # NOTE: plain HTTP. The pod network is unencrypted flannel vxlan, so
      # the credentials and the cert private key cross the LAN in cleartext
      # when operator and Infisical run on different nodes. Closing this
      # properly means encrypting the CNI (flannel-backend: wireguard-native);
      # tracked as a follow-up.
      hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
      auth:
        universalAuthCredentials:
          clientId:
            namespace: external-secrets
            name: infisical-universal-auth
            key: clientId
          clientSecret:
            namespace: external-secrets
            name: infisical-universal-auth
            key: clientSecret
      secretsScope:
        projectSlug: infrastructure-j8n1
        environmentSlug: prod
        # Least privilege: this store can only see the wildcard cert folder.
        # Add one store per path/consumer for other secrets (API keys etc.)
        # instead of widening this one.
        secretsPath: /tls/theedgeworks-wildcard
        recursive: false
