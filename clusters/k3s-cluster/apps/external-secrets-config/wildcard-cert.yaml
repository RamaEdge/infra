# The *.theedgeworks.ai wildcard cert is stored once in Infisical
# (project infrastructure, prod:/tls/theedgeworks-wildcard: TLS_CRT = full
# chain, TLS_KEY = private key) and synced into every consumer namespace.
#
# To renew: update TLS_CRT and TLS_KEY in Infisical. The secrets below update
# within refreshInterval; ingress-nginx reloads certs from the Secret itself.
#
# creationPolicy: Orphan on purpose: the Secret is not owned by the
# ExternalSecret, so deleting or pruning an ExternalSecret can never delete a
# live TLS secret. The template trims and re-adds the trailing newline.
#
# Deliberately NOT synced: infisical/infisical-tls (the vault's own front
# door). If a bad TLS_CRT were ever saved in the vault it would otherwise be
# pushed to the vault's own ingress too. It stays a hand-managed copy of the
# wildcard (see apps/infisical/SECRETS.md) and must be renewed alongside the
# vault entry.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chromadb-tls
  namespace: chromadb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: chromadb-tls
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt | trim }}\n"
        tls.key: "{{ .key | trim }}\n"
  data:
    - secretKey: crt
      remoteRef:
        key: TLS_CRT
    - secretKey: key
      remoteRef:
        key: TLS_KEY
