apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/k3s-cluster/apps/external-secrets-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  # CRDs come from the external-secrets HelmRelease in the infra kustomization
  dependsOn:
    - name: infra
